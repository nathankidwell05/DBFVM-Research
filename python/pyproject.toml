[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-dbmboltz"
version = "0.1.0"
description = "Finite-volume discrete Boltzmann prototypes for compressible-flow validation."
requires-python = ">=3.10"
dependencies = [
  "jax[cpu]>=0.4.30",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["dbm2d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
